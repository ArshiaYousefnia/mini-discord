services:
  backend:
    image: ${HARBOR_HOST:-registry.hamdocker.ir}/${HARBOR_PROJECT:-ayousefnia}/backend:${BACKEND_TAG:-latest}
    container_name: django-backend
    restart: unless-stopped
    volumes:
      - ./.env:/app/.env
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - postgres
      - redis
      - minio-init
    environment:
      - DJANGO_SETTINGS_MODULE=mini_discord.settings
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-django_db}
      - DB_USER=${DB_USER:-django_user}
      - DB_PASSWORD=${DB_PASSWORD:-django_password}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}

  frontend:
    image: ${HARBOR_HOST:-registry.hamdocker.ir}/${HARBOR_PROJECT:-ayousefnia}/frontend:${FRONTEND_TAG:-latest}
    container_name: react-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:alpine
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-django_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-django_password}
      POSTGRES_DB: ${DB_NAME:-django_db}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-django_user} -d ${DB_NAME:-django_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: minio-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  avatar-fetch:
    image: curlimages/curl:latest
    container_name: avatar-fetch
    user: root
    volumes:
      - avatar_asset:/asset
    entrypoint: >
      sh -c "
        curl -sSL -o /asset/default_avatar.svg ${DEFAULT_AVATAR_URL:-https://raw.githubusercontent.com/ArshiaYousefnia/mini-discord/main/backend/static/images/default_avatar.svg};
        echo 'Avatar downloaded.';
      "
    restart: "no"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
      - avatar-fetch
    volumes:
      - avatar_asset:/asset
    entrypoint: >
      /bin/sh -c "
        set -e;
        until mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
          echo 'Waiting for MinIO...';
          sleep 2;
        done;
        echo 'MinIO ready.';
        mc mb myminio/avatars --ignore-existing;
        echo 'Bucket avatars ready.';
        mc cp /asset/default_avatar.svg myminio/avatars/default_avatar.svg;
        echo 'Default avatar uploaded.';
        mc anonymous set public myminio/avatars;
        echo 'Bucket set to public.';
        exit 0;
      "
    restart: "no"

  celery_worker:
    image: ${HARBOR_HOST:-registry.hamdocker.ir}/${HARBOR_PROJECT:-ayousefnia}/backend:${BACKEND_TAG:-latest}
    container_name: celery-worker
    restart: unless-stopped
    command: celery -A mini_discord worker --loglevel=info
    volumes:
      - ./.env:/app/.env
    environment:
      - DJANGO_SETTINGS_MODULE=mini_discord.settings
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-django_db}
      - DB_USER=${DB_USER:-django_user}
      - DB_PASSWORD=${DB_PASSWORD:-django_password}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: ${HARBOR_HOST:-registry.hamdocker.ir}/${HARBOR_PROJECT:-ayousefnia}/backend:${BACKEND_TAG:-latest}
    container_name: celery-beat
    restart: unless-stopped
    command: celery -A mini_discord beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./.env:/app/.env
    environment:
      - DJANGO_SETTINGS_MODULE=mini_discord.settings
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-django_db}
      - DB_USER=${DB_USER:-django_user}
      - DB_PASSWORD=${DB_PASSWORD:-django_password}
      - DB_PORT=5432
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  avatar_asset: